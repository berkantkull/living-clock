<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <meta name="description" content="Zamanın akışını sürekli dönüşen organik bir biçimle görünür kılan deneysel dijital saat.">
  <title>Living Clock — Zaman Canlıdır</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23070809'/%3E%3Cpath d='M32 10C44 10 54 20 54 32S44 54 32 54 10 44 10 32 20 10 32 10Z' fill='none' stroke='%23e8edf2' stroke-width='2'/%3E%3Cpath d='M32 17v15l10 6' fill='none' stroke='%23e8edf2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070809;
      --ink: #f3f5f6;
      --muted: rgba(238, 243, 246, .48);
      --faint: rgba(238, 243, 246, .16);
      --hairline: rgba(238, 243, 246, .12);
      --focus: #dce9f2;
      --ambient: rgba(137, 166, 185, .08);
      --safe-top: max(24px, env(safe-area-inset-top));
      --safe-right: max(24px, env(safe-area-inset-right));
      --safe-bottom: max(22px, env(safe-area-inset-bottom));
      --safe-left: max(24px, env(safe-area-inset-left));
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      position: relative;
      isolation: isolate;
      transition: background-color 1.6s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, var(--ambient), transparent 35%),
        radial-gradient(circle at 8% 0%, rgba(255,255,255,.025), transparent 26%);
      filter: blur(18px);
      transition: background 1.6s ease;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.11'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 1px solid var(--focus);
      outline-offset: 4px;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
    }

    .topbar,
    .footer {
      position: absolute;
      z-index: 4;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    }

    .topbar {
      top: 0;
      padding: var(--safe-top) var(--safe-right) 0 var(--safe-left);
    }

    .footer {
      bottom: 0;
      align-items: flex-end;
      padding: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
    }

    .brand,
    .status,
    .theme-panel,
    .controls,
    .manifesto { pointer-events: auto; }

    .brand-title {
      margin: 0;
      font-size: .78rem;
      font-weight: 530;
      letter-spacing: .24em;
      line-height: 1.2;
    }

    .eyebrow,
    .manifesto,
    .status,
    .theme-label,
    .theme-button,
    .language-button,
    .control-button {
      text-transform: uppercase;
      letter-spacing: .18em;
    }

    .eyebrow {
      margin-top: .55rem;
      color: var(--muted);
      font-size: .67rem;
      line-height: 1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      pointer-events: auto;
    }

    .language-switch {
      display: flex;
      align-items: center;
      gap: .15rem;
      padding: .18rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: rgba(7,8,9,.28);
      backdrop-filter: blur(16px);
    }

    .language-button {
      min-width: 2.35rem;
      min-height: 2rem;
      padding: 0 .55rem;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .62rem;
      transition: color .25s ease, background .25s ease;
    }

    .language-button[aria-pressed="true"] {
      color: var(--ink);
      background: rgba(255,255,255,.08);
    }

    .status {
      display: flex;
      align-items: center;
      gap: .58rem;
      min-height: 2.35rem;
      color: var(--muted);
      font-size: .64rem;
    }

    .status-dot {
      position: relative;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e9f1f5;
      box-shadow: 0 0 14px rgba(232,241,246,.7);
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 1px solid rgba(232,241,246,.3);
      border-radius: inherit;
      animation: signal 2.6s ease-out infinite;
    }

    @keyframes signal {
      0% { transform: scale(.4); opacity: 0; }
      20% { opacity: .8; }
      100% { transform: scale(1.75); opacity: 0; }
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
    }

    #clockCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .time-lockup {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
      user-select: none;
      transform: translateY(-.5vh);
      text-shadow: 0 2px 24px rgba(0,0,0,.4);
    }

    .time {
      font-variant-numeric: tabular-nums lining-nums;
      font-size: clamp(3.2rem, 10.8vw, 9.25rem);
      font-weight: 200;
      line-height: .86;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .date {
      margin-top: clamp(1.25rem, 3vh, 2.25rem);
      color: rgba(245,247,248,.62);
      font-size: clamp(.68rem, 1vw, .82rem);
      font-weight: 450;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: .22em;
    }

    .manifesto {
      padding-bottom: .75rem;
      color: var(--muted);
      font-size: .64rem;
      white-space: nowrap;
    }

    .theme-panel {
      position: absolute;
      left: 50%;
      bottom: var(--safe-bottom);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .78rem;
      transform: translateX(-50%);
      transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    }

    .theme-label {
      color: rgba(245,247,248,.36);
      font-size: .58rem;
    }

    .theme-switcher {
      display: flex;
      align-items: center;
      gap: .2rem;
      padding: .3rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: rgba(7,8,9,.34);
      box-shadow: 0 14px 44px rgba(0,0,0,.16);
      backdrop-filter: blur(18px);
    }

    .theme-button {
      position: relative;
      min-height: 2.2rem;
      padding: 0 .78rem;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .58rem;
      white-space: nowrap;
      transition: color .3s ease, background .3s ease;
    }

    .theme-button:hover { color: var(--ink); }

    .theme-button[aria-pressed="true"] {
      color: var(--ink);
      background: rgba(255,255,255,.085);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: .45rem;
    }

    .control-button {
      position: relative;
      display: grid;
      width: 2.75rem;
      height: 2.75rem;
      place-items: center;
      border: 1px solid var(--hairline);
      border-radius: 50%;
      color: rgba(244,247,248,.72);
      background: rgba(7,8,9,.28);
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: color .25s ease, border-color .25s ease, background .25s ease, transform .25s ease;
    }

    .control-button:hover {
      color: #fff;
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.06);
      transform: translateY(-2px);
    }

    .control-button[aria-pressed="true"] {
      color: #fff;
      background: rgba(255,255,255,.1);
    }

    .control-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: calc(var(--safe-top) + 3.8rem);
      z-index: 20;
      max-width: calc(100vw - 2rem);
      padding: .72rem 1rem;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: rgba(255,255,255,.84);
      background: rgba(7,8,9,.78);
      font-size: .72rem;
      letter-spacing: .04em;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px);
      backdrop-filter: blur(18px);
      transition: opacity .3s ease, transform .3s ease;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    body.zen .topbar,
    body.zen .footer,
    body.zen .theme-panel {
      opacity: 0;
      pointer-events: none;
    }

    body.zen .topbar { transform: translateY(-18px); }
    body.zen .footer { transform: translateY(18px); }
    body.zen .theme-panel { transform: translate(-50%, 18px); }
    body.zen .stage { cursor: none; }

    @media (max-width: 820px) {
      :root {
        --safe-top: max(18px, env(safe-area-inset-top));
        --safe-right: max(16px, env(safe-area-inset-right));
        --safe-bottom: max(16px, env(safe-area-inset-bottom));
        --safe-left: max(16px, env(safe-area-inset-left));
      }

      .top-actions { gap: .65rem; }
      .status span:last-child { display: none; }
      .theme-panel { bottom: calc(var(--safe-bottom) + 3.6rem); }
      .theme-label { display: none; }
      .theme-switcher { max-width: calc(100vw - 2rem); overflow-x: auto; scrollbar-width: none; }
      .theme-switcher::-webkit-scrollbar { display: none; }
      .theme-button { padding: 0 .62rem; }
      .manifesto { max-width: 7rem; white-space: normal; line-height: 1.5; }
      .controls { gap: .3rem; }
      .control-button { width: 2.55rem; height: 2.55rem; }
      .date { max-width: 82vw; }
    }

    @media (max-width: 430px) {
      .brand-title { font-size: .69rem; }
      .eyebrow { font-size: .58rem; }
      .language-button { min-width: 2.05rem; min-height: 1.85rem; }
      .time { font-size: clamp(2.9rem, 16.5vw, 4.5rem); }
      .date { font-size: .62rem; letter-spacing: .16em; }
      .manifesto { font-size: .56rem; max-width: 5.5rem; }
      .theme-button { min-height: 2rem; padding: 0 .52rem; font-size: .53rem; }
    }

    @media (max-height: 590px) and (orientation: landscape) {
      .theme-panel { bottom: var(--safe-bottom); }
      .theme-label { display: none; }
      .time { font-size: clamp(3rem, 12vw, 6.5rem); }
      .date { margin-top: .9rem; }
      .manifesto { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .15s !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Living Clock">
    <header class="topbar">
      <div class="brand" aria-label="Living Clock, Deney 001">
        <h1 class="brand-title">LIVING CLOCK</h1>
        <div class="eyebrow" data-i18n="experiment">DENEY 001</div>
      </div>

      <div class="top-actions">
        <div class="language-switch" role="group" aria-label="Dil / Language">
          <button class="language-button" type="button" data-lang="tr" aria-pressed="true">TR</button>
          <button class="language-button" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-i18n="live">CANLI</span>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Zamanla dönüşen etkileşimli organik form" data-i18n-aria="stage">
      <canvas id="clockCanvas" aria-hidden="true"></canvas>
      <div class="time-lockup">
        <time class="time" id="time" datetime="">00:00:00</time>
        <div class="date" id="date">—</div>
      </div>
    </section>

    <div class="theme-panel">
      <div class="theme-label" data-i18n="atmosphere">ATMOSFER</div>
      <div class="theme-switcher" role="group" aria-label="Görsel tema" data-i18n-aria="themes">
        <button class="theme-button" type="button" data-theme="auto" aria-pressed="true" data-i18n="auto">OTOMATİK</button>
        <button class="theme-button" type="button" data-theme="liquid" aria-pressed="false" data-i18n="liquid">SIVI</button>
        <button class="theme-button" type="button" data-theme="solar" aria-pressed="false" data-i18n="solar">GÜNEŞ</button>
        <button class="theme-button" type="button" data-theme="nebula" aria-pressed="false" data-i18n="nebula">NEBULA</button>
        <button class="theme-button" type="button" data-theme="mono" aria-pressed="false" data-i18n="mono">MONOKROM</button>
      </div>
    </div>

    <footer class="footer">
      <div class="manifesto" data-i18n="manifesto">ZAMAN CANLIDIR.</div>
      <div class="controls" aria-label="Görüntü kontrolleri" data-i18n-aria="controls">
        <button class="control-button" id="fullscreenButton" type="button" aria-label="Tam ekran" data-i18n-aria="fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
        <button class="control-button" id="zenButton" type="button" aria-label="Zen modu" data-i18n-aria="zen" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12c2.1-3.6 4.8-5.4 8-5.4s5.9 1.8 8 5.4c-2.1 3.6-4.8 5.4-8 5.4S6.1 15.6 4 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
        </button>
        <button class="control-button" id="screenshotButton" type="button" aria-label="PNG olarak kaydet" data-i18n-aria="screenshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.4-2h7.2l1.4 2h3v10H4Z"/><circle cx="12" cy="13.2" r="3.1"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('clockCanvas');
      const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
      const stage = document.getElementById('stage');
      const timeElement = document.getElementById('time');
      const dateElement = document.getElementById('date');
      const toastElement = document.getElementById('toast');
      const themeButtons = [...document.querySelectorAll('[data-theme]')];
      const languageButtons = [...document.querySelectorAll('[data-lang]')];
      const fullscreenButton = document.getElementById('fullscreenButton');
      const zenButton = document.getElementById('zenButton');
      const screenshotButton = document.getElementById('screenshotButton');
      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;

      const copy = {
        tr: {
          experiment: 'DENEY 001', live: 'CANLI', atmosphere: 'ATMOSFER',
          auto: 'OTOMATİK', liquid: 'SIVI', solar: 'GÜNEŞ', nebula: 'NEBULA', mono: 'MONOKROM',
          manifesto: 'ZAMAN CANLIDIR.', stage: 'Zamanla dönüşen etkileşimli organik form',
          themes: 'Görsel tema', controls: 'Görüntü kontrolleri', fullscreen: 'Tam ekran',
          zen: 'Zen modu', screenshot: 'PNG olarak kaydet', screenshotSaved: 'Kompozisyon PNG olarak kaydedildi.',
          screenshotError: 'Görüntü kaydedilemedi.', fullscreenError: 'Tam ekran bu tarayıcıda desteklenmiyor.',
          zenExit: 'Zen modundan çıkmak için dokunun veya Escape tuşuna basın.'
        },
        en: {
          experiment: 'EXPERIMENT 001', live: 'LIVE', atmosphere: 'ATMOSPHERE',
          auto: 'AUTO', liquid: 'LIQUID', solar: 'SOLAR', nebula: 'NEBULA', mono: 'MONOCHROME',
          manifesto: 'TIME IS ALIVE.', stage: 'Interactive organic form evolving with time',
          themes: 'Visual theme', controls: 'Display controls', fullscreen: 'Fullscreen',
          zen: 'Zen mode', screenshot: 'Save as PNG', screenshotSaved: 'Composition saved as PNG.',
          screenshotError: 'The image could not be saved.', fullscreenError: 'Fullscreen is not supported by this browser.',
          zenExit: 'Tap or press Escape to leave Zen mode.'
        }
      };

      const themes = {
        liquid: {
          colors: [[239,245,248],[150,169,180],[255,255,255]], glow: [163,194,210],
          bg: '#070809', ambient: 'rgba(145, 177, 194, .10)', layers: 22, amp: .105, detail: 7,
          twist: 2.4, speed: .72, drift: .24, line: .78, fill: .030
        },
        solar: {
          colors: [[255,202,123],[240,108,53],[156,39,28]], glow: [255,108,45],
          bg: '#090705', ambient: 'rgba(255, 102, 37, .12)', layers: 18, amp: .145, detail: 5,
          twist: 3.2, speed: .92, drift: .34, line: .72, fill: .040
        },
        nebula: {
          colors: [[189,161,255],[92,139,255],[89,223,231]], glow: [111,98,255],
          bg: '#06070b', ambient: 'rgba(103, 83, 255, .13)', layers: 26, amp: .125, detail: 8,
          twist: 4.1, speed: .58, drift: .42, line: .62, fill: .025
        },
        mono: {
          colors: [[255,255,255],[166,170,174],[78,82,86]], glow: [210,218,223],
          bg: '#050606', ambient: 'rgba(210, 218, 223, .055)', layers: 34, amp: .072, detail: 11,
          twist: 1.6, speed: .38, drift: .15, line: .48, fill: .008
        }
      };

      const state = {
        width: 0, height: 0, dpr: 1, cx: 0, cy: 0, radius: 0,
        pointerX: .5, pointerY: .5, smoothX: .5, smoothY: .5, pointerActive: 0,
        theme: localStorage.getItem('living-clock-theme') || 'auto',
        language: localStorage.getItem('living-clock-language') || 'tr',
        effectiveTheme: 'liquid', previousEffectiveTheme: 'liquid',
        palette: new Float32Array(12), targetPalette: new Float32Array(12),
        geometry: new Float32Array(8), targetGeometry: new Float32Array(8),
        ripples: [], midnightPulse: 0, lastMinute: -1, lastHour: -1,
        lastSecond: -1, running: true, zen: false, toastTimer: 0, frame: 0
      };

      if (!themes[state.theme] && state.theme !== 'auto') state.theme = 'auto';
      if (!copy[state.language]) state.language = 'tr';

      function autoTheme(hour) {
        if (hour >= 5 && hour < 10) return 'solar';
        if (hour >= 10 && hour < 17) return 'liquid';
        if (hour >= 17 && hour < 22) return 'nebula';
        return 'mono';
      }

      function setTargets(name, immediate = false) {
        const theme = themes[name];
        let p = 0;
        for (let i = 0; i < 3; i++) {
          state.targetPalette[p++] = theme.colors[i][0];
          state.targetPalette[p++] = theme.colors[i][1];
          state.targetPalette[p++] = theme.colors[i][2];
        }
        state.targetPalette[p++] = theme.glow[0];
        state.targetPalette[p++] = theme.glow[1];
        state.targetPalette[p++] = theme.glow[2];
        state.targetGeometry.set([theme.layers, theme.amp, theme.detail, theme.twist, theme.speed, theme.drift, theme.line, theme.fill]);
        document.documentElement.style.setProperty('--ambient', theme.ambient);
        document.documentElement.style.setProperty('--bg', theme.bg);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme.bg);
        if (immediate) {
          state.palette.set(state.targetPalette);
          state.geometry.set(state.targetGeometry);
        }
      }

      function updateEffectiveTheme(now, immediate = false) {
        const effective = state.theme === 'auto' ? autoTheme(now.getHours()) : state.theme;
        if (effective !== state.effectiveTheme || immediate) {
          state.previousEffectiveTheme = state.effectiveTheme;
          state.effectiveTheme = effective;
          setTargets(effective, immediate);
        }
      }

      function setTheme(name) {
        state.theme = name;
        localStorage.setItem('living-clock-theme', name);
        themeButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.theme === name)));
        updateEffectiveTheme(new Date());
      }

      function setLanguage(language) {
        state.language = language;
        localStorage.setItem('living-clock-language', language);
        document.documentElement.lang = language;
        document.title = language === 'tr' ? 'Living Clock — Zaman Canlıdır' : 'Living Clock — Time Is Alive';
        document.querySelector('meta[name="description"]').content = language === 'tr'
          ? 'Zamanın akışını sürekli dönüşen organik bir biçimle görünür kılan deneysel dijital saat.'
          : 'An experimental digital clock that makes time visible through a continuously evolving organic form.';
        languageButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === language)));
        document.querySelectorAll('[data-i18n]').forEach(element => {
          element.textContent = copy[language][element.dataset.i18n];
        });
        document.querySelectorAll('[data-i18n-aria]').forEach(element => {
          element.setAttribute('aria-label', copy[language][element.dataset.i18nAria]);
        });
        state.lastSecond = -1;
      }

      function resize() {
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        state.width = innerWidth;
        state.height = innerHeight;
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        canvas.style.width = state.width + 'px';
        canvas.style.height = state.height + 'px';
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        state.cx = state.width * .5;
        state.cy = state.height * (state.width < 700 ? .465 : .485);
        state.radius = Math.min(state.width, state.height) * (state.width < 700 ? .34 : .37);
      }

      function rgba(offset, alpha, light = 1) {
        const hourMood = .90 + .10 * Math.cos((new Date().getHours() / 24) * TAU - Math.PI);
        const r = Math.min(255, state.palette[offset] * light * hourMood);
        const g = Math.min(255, state.palette[offset + 1] * light * hourMood);
        const b = Math.min(255, state.palette[offset + 2] * light * hourMood);
        return `rgba(${r|0},${g|0},${b|0},${alpha})`;
      }

      function lerpTargets() {
        for (let i = 0; i < state.palette.length; i++) state.palette[i] += (state.targetPalette[i] - state.palette[i]) * .025;
        for (let i = 0; i < state.geometry.length; i++) state.geometry[i] += (state.targetGeometry[i] - state.geometry[i]) * .022;
      }

      function addRipple(x, y, strength = 1) {
        if (state.ripples.length > 7) state.ripples.shift();
        state.ripples.push({ x, y, age: 0, strength });
      }

      function drawAtmosphere(t) {
        ctx.clearRect(0, 0, state.width, state.height);
        const pulse = state.midnightPulse;
        const wobbleX = state.cx + Math.sin(t * .00013) * state.radius * .08;
        const wobbleY = state.cy + Math.cos(t * .00011) * state.radius * .06;
        const glowRadius = state.radius * (1.35 + pulse * .35);
        const glow = ctx.createRadialGradient(wobbleX, wobbleY, 0, wobbleX, wobbleY, glowRadius);
        glow.addColorStop(0, rgba(9, .10 + pulse * .06));
        glow.addColorStop(.36, rgba(9, .045 + pulse * .02));
        glow.addColorStop(1, rgba(9, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(wobbleX - glowRadius, wobbleY - glowRadius, glowRadius * 2, glowRadius * 2);
      }

      function contourRadius(theta, layer, t, now) {
        const amp = state.geometry[1];
        const detail = state.geometry[2];
        const twist = state.geometry[3];
        const speed = state.geometry[4];
        const minute = now.getMinutes() + now.getSeconds() / 60;
        const second = now.getSeconds() + now.getMilliseconds() / 1000;
        const breath = Math.sin(t * .00042 * speed + layer * .18) * .026;
        const minuteBody = Math.sin(theta * 2 + minute * .045 + t * .00008) * amp * .36;
        const slowNoise = Math.sin(theta * (3 + twist * .35) + t * .00018 * speed + Math.sin(theta * 2.1 - t * .00009)) * amp * .54;
        const surface = Math.sin(theta * detail - t * .00038 * speed + layer * .21 + second * .052) * amp * .17;
        const cross = Math.sin(theta * (detail * .47 + 1.6) + Math.cos(theta * 3 - t * .00014) * 1.3) * amp * .22;
        return 1 + breath + minuteBody + slowNoise + surface + cross;
      }

      function drawContours(t, now) {
        const layerCount = Math.round(state.geometry[0]);
        const lineAlpha = state.geometry[6];
        const fillAlpha = state.geometry[7];
        const drift = state.geometry[5];
        const pointCount = prefersReducedMotion.matches ? 150 : 220;
        const pointerDx = (state.smoothX - .5) * state.radius * .18 * state.pointerActive;
        const pointerDy = (state.smoothY - .5) * state.radius * .14 * state.pointerActive;
        const rotation = Math.sin(t * .00007) * .16 * drift;

        ctx.save();
        ctx.translate(state.cx + pointerDx * .18, state.cy + pointerDy * .18);
        ctx.rotate(rotation);
        ctx.globalCompositeOperation = state.effectiveTheme === 'solar' ? 'screen' : 'lighter';

        for (let layer = layerCount - 1; layer >= 0; layer--) {
          const depth = layerCount <= 1 ? 0 : layer / (layerCount - 1);
          const spread = .55 + depth * .52;
          const layerRadius = state.radius * spread;
          const phase = layer * .137;
          const paletteOffset = (layer % 3) * 3;
          ctx.beginPath();

          for (let i = 0; i <= pointCount; i++) {
            const theta = (i / pointCount) * TAU;
            const organic = contourRadius(theta + phase * .14, layer, t, now);
            const asymmetry = 1 + Math.cos(theta - t * .00009 + phase) * .018 * drift;
            const angleToPointer = Math.atan2(pointerDy, pointerDx || .0001);
            const pointerArc = Math.max(0, Math.cos(theta - angleToPointer));
            const pointerBulge = pointerArc * pointerArc * state.pointerActive * .018 * (1 - depth * .35);
            const r = layerRadius * (organic + pointerBulge) + Math.sin(theta * 2 + phase) * layer * .18;
            const x = Math.cos(theta) * r + pointerDx * (1 - depth) * .16;
            const y = Math.sin(theta) * r * (.94 + Math.sin(t * .0001 + layer) * .015) + pointerDy * (1 - depth) * .12;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }

          ctx.closePath();
          ctx.lineWidth = Math.max(.36, (1.15 - depth * .55) * state.geometry[6]);
          ctx.strokeStyle = rgba(paletteOffset, (0.055 + (1 - depth) * .125) * lineAlpha);
          ctx.stroke();

          if (layer % 4 === 0 && fillAlpha > .01) {
            ctx.fillStyle = rgba(paletteOffset, fillAlpha * (1 - depth) * .38);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      function drawCore(t) {
        const x = state.cx + (state.smoothX - .5) * state.radius * .025 * state.pointerActive;
        const y = state.cy + (state.smoothY - .5) * state.radius * .025 * state.pointerActive;
        const r = state.radius * (.21 + Math.sin(t * .0005) * .012);
        const core = ctx.createRadialGradient(x, y, 0, x, y, r);
        core.addColorStop(0, rgba(0, .035));
        core.addColorStop(.7, rgba(3, .012));
        core.addColorStop(1, rgba(6, 0));
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fill();
      }

      function drawRipples(delta) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = state.ripples.length - 1; i >= 0; i--) {
          const ripple = state.ripples[i];
          ripple.age += delta * .00055;
          const eased = 1 - Math.pow(1 - Math.min(ripple.age, 1), 3);
          const radius = state.radius * (.14 + eased * 1.25);
          const alpha = Math.max(0, (1 - ripple.age) * .18 * ripple.strength);
          ctx.beginPath();
          ctx.arc(ripple.x, ripple.y, radius, 0, TAU);
          ctx.lineWidth = 1;
          ctx.strokeStyle = rgba(9, alpha);
          ctx.stroke();
          if (ripple.age >= 1) state.ripples.splice(i, 1);
        }
        ctx.restore();
      }

      function updateClock(now) {
        const second = now.getSeconds();
        if (second !== state.lastSecond) {
          state.lastSecond = second;
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          const ss = String(second).padStart(2, '0');
          timeElement.textContent = `${hh}:${mm}:${ss}`;
          timeElement.dateTime = now.toISOString();
          const locale = state.language === 'tr' ? 'tr-TR' : 'en-US';
          dateElement.textContent = new Intl.DateTimeFormat(locale, {
            weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
          }).format(now);
        }

        const minuteKey = now.getHours() * 60 + now.getMinutes();
        if (state.lastMinute !== -1 && minuteKey !== state.lastMinute) addRipple(state.cx, state.cy, .85);
        state.lastMinute = minuteKey;

        const hour = now.getHours();
        if (state.lastHour === 23 && hour === 0) {
          state.midnightPulse = 1;
          addRipple(state.cx, state.cy, 1.7);
        }
        state.lastHour = hour;
        if (state.theme === 'auto') updateEffectiveTheme(now);
      }

      let previousTime = performance.now();
      function render(timestamp) {
        if (!state.running) return;
        const delta = Math.min(50, timestamp - previousTime || 16.7);
        previousTime = timestamp;
        const now = new Date();
        updateClock(now);
        lerpTargets();
        state.smoothX += (state.pointerX - state.smoothX) * .045;
        state.smoothY += (state.pointerY - state.smoothY) * .045;
        state.pointerActive += ((state.pointerActive > .01 ? 1 : 0) - state.pointerActive) * .03;
        state.midnightPulse *= .987;
        const visualTime = prefersReducedMotion.matches ? Math.floor(timestamp / 5000) * 5000 : timestamp;
        drawAtmosphere(visualTime);
        drawContours(visualTime, now);
        drawCore(visualTime);
        drawRipples(prefersReducedMotion.matches ? delta * .12 : delta);
        state.frame = requestAnimationFrame(render);
      }

      function showToast(message) {
        clearTimeout(state.toastTimer);
        toastElement.textContent = message;
        toastElement.classList.add('visible');
        state.toastTimer = setTimeout(() => toastElement.classList.remove('visible'), 2800);
      }

      function toggleZen(force) {
        state.zen = typeof force === 'boolean' ? force : !state.zen;
        document.body.classList.toggle('zen', state.zen);
        zenButton.setAttribute('aria-pressed', String(state.zen));
        if (state.zen) showToast(copy[state.language].zenExit);
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            if (!document.documentElement.requestFullscreen) throw new Error('unsupported');
            await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          } else {
            await document.exitFullscreen();
          }
        } catch (_) {
          showToast(copy[state.language].fullscreenError);
        }
      }

      function drawExportText(exportContext, width, height, scale) {
        const timeSize = Math.min(width * .105, height * .17);
        exportContext.save();
        exportContext.textAlign = 'center';
        exportContext.textBaseline = 'middle';
        exportContext.shadowColor = 'rgba(0,0,0,.4)';
        exportContext.shadowBlur = 24 * scale;
        exportContext.fillStyle = 'rgba(248,249,250,.96)';
        exportContext.font = `200 ${timeSize}px Inter, Helvetica Neue, Arial, sans-serif`;
        exportContext.fillText(timeElement.textContent, width / 2, height * .49);
        exportContext.shadowBlur = 0;
        exportContext.fillStyle = 'rgba(245,247,248,.62)';
        exportContext.font = `500 ${Math.max(12 * scale, timeSize * .087)}px Inter, Helvetica Neue, Arial, sans-serif`;
        exportContext.fillText(dateElement.textContent.toLocaleUpperCase(state.language === 'tr' ? 'tr-TR' : 'en-US'), width / 2, height * .49 + timeSize * .72);
        exportContext.textAlign = 'left';
        exportContext.fillStyle = 'rgba(245,247,248,.76)';
        exportContext.font = `500 ${13 * scale}px Inter, Helvetica Neue, Arial, sans-serif`;
        exportContext.fillText('LIVING CLOCK', 34 * scale, 38 * scale);
        exportContext.fillStyle = 'rgba(245,247,248,.35)';
        exportContext.font = `500 ${9 * scale}px Inter, Helvetica Neue, Arial, sans-serif`;
        exportContext.fillText(copy[state.language].experiment, 34 * scale, 57 * scale);
        exportContext.restore();
      }

      async function saveScreenshot() {
        try {
          const scale = Math.min(2, window.devicePixelRatio || 1);
          const exportCanvas = document.createElement('canvas');
          exportCanvas.width = Math.round(state.width * scale);
          exportCanvas.height = Math.round(state.height * scale);
          const exportContext = exportCanvas.getContext('2d');
          exportContext.fillStyle = themes[state.effectiveTheme].bg;
          exportContext.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
          const halo = exportContext.createRadialGradient(exportCanvas.width / 2, exportCanvas.height * .47, 0, exportCanvas.width / 2, exportCanvas.height * .47, Math.min(exportCanvas.width, exportCanvas.height) * .55);
          halo.addColorStop(0, rgba(9, .11));
          halo.addColorStop(1, rgba(9, 0));
          exportContext.fillStyle = halo;
          exportContext.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
          exportContext.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
          drawExportText(exportContext, exportCanvas.width, exportCanvas.height, scale);
          const blob = await new Promise((resolve, reject) => exportCanvas.toBlob(value => value ? resolve(value) : reject(new Error('blob')), 'image/png'));
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          const stamp = new Date().toISOString().replace(/[:.]/g, '-');
          anchor.href = url;
          anchor.download = `living-clock-${stamp}.png`;
          anchor.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(copy[state.language].screenshotSaved);
        } catch (_) {
          showToast(copy[state.language].screenshotError);
        }
      }

      function updatePointer(event) {
        state.pointerX = Math.max(0, Math.min(1, event.clientX / state.width));
        state.pointerY = Math.max(0, Math.min(1, event.clientY / state.height));
        state.pointerActive = Math.max(state.pointerActive, .12);
      }

      stage.addEventListener('pointermove', updatePointer, { passive: true });
      stage.addEventListener('pointerenter', () => { state.pointerActive = .2; });
      stage.addEventListener('pointerleave', () => {
        state.pointerX = state.pointerY = .5;
        state.pointerActive = .001;
      });
      stage.addEventListener('pointerdown', event => {
        updatePointer(event);
        if (state.zen) {
          toggleZen(false);
        } else {
          addRipple(event.clientX, event.clientY, 1.15);
        }
      });

      themeButtons.forEach(button => button.addEventListener('click', () => setTheme(button.dataset.theme)));
      languageButtons.forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
      fullscreenButton.addEventListener('click', toggleFullscreen);
      zenButton.addEventListener('click', () => toggleZen());
      screenshotButton.addEventListener('click', saveScreenshot);

      document.addEventListener('fullscreenchange', () => fullscreenButton.setAttribute('aria-pressed', String(Boolean(document.fullscreenElement))));
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && state.zen) toggleZen(false);
        if (event.key.toLowerCase() === 'z' && !event.ctrlKey && !event.metaKey && !event.altKey) toggleZen();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          state.running = false;
          cancelAnimationFrame(state.frame);
        } else if (!state.running) {
          state.running = true;
          previousTime = performance.now();
          state.frame = requestAnimationFrame(render);
        }
      });
      addEventListener('resize', resize, { passive: true });

      resize();
      updateEffectiveTheme(new Date(), true);
      setTheme(state.theme);
      setLanguage(state.language);
      updateClock(new Date());
      state.frame = requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
