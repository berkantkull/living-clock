<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0b">
  <meta name="author" content="Berkant Kul">
  <meta name="description" content="Zamanla evrilen yaşam biçimleri üzerine etkileşimli bir dijital enstalasyon.">
  <title>Living Clock — Zaman canlıdır</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' rx='13' fill='%230c0c0b'/%3E%3Cpath d='M47 12C27 8 8 26 15 42 20 54 39 51 44 38 49 25 35 20 27 28 21 35 30 42 35 36' fill='none' stroke='%23dbb582' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee9df;
      --muted: #a9a296;
      --quiet: #8f887e;
      --bg: #0c0c0b;
      --line: #302c25;
      --accent: #e2ba8b;
      --sans: "Segoe UI", system-ui, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-synthesis: none;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .installation {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(420px, 1fr) auto;
      padding: 0 max(clamp(20px, 4vw, 64px), env(safe-area-inset-right))
        env(safe-area-inset-bottom) max(clamp(20px, 4vw, 64px), env(safe-area-inset-left));
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-block: max(20px, env(safe-area-inset-top)) 20px;
    }

    .wordmark { display: flex; align-items: center; gap: 12px; }
    .wordmark svg { width: 32px; height: 32px; color: var(--accent); }
    .wordmark h1 { margin: 0; font: 400 25px/1 var(--serif); letter-spacing: -.045em; }
    .wordmark small, .caption, .stage-label {
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .wordmark small { display: block; margin-top: 6px; font-size: .65rem; }
    .credit { color: inherit; text-decoration: none; text-underline-offset: 3px; }
    .credit:hover { text-decoration: underline; }
    .credit:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

    .toolbar, .languages, .view-tools { display: flex; align-items: center; }
    .toolbar { gap: 7px; }
    .view-tools { gap: 7px; }
    .languages { border: 1px solid var(--line); border-radius: 3px; margin-right: 5px; }
    .languages button, .tool {
      display: grid;
      place-items: center;
      width: 42px;
      min-height: 42px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      transition: color 160ms, background 160ms, border-color 160ms;
    }
    .languages button { font-size: .75rem; letter-spacing: .08em; }
    .tool { border-color: var(--line); border-radius: 3px; }
    .toolbar button:hover, .toolbar button[aria-pressed=true] { color: var(--ink); background: #24211b; }
    .tool svg, .mutation svg { width: 19px; height: 19px; }

    .stage {
      position: relative;
      min-height: 0;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #10100e;
    }
    .stage::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      box-shadow: inset 0 0 80px #08080770;
      pointer-events: none;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .art-space {
      display: none;
      position: relative;
      z-index: 1;
      touch-action: none;
      touch-action: pinch-zoom;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-hint { display: none; }
    .stage-label {
      display: flex;
      align-items: center;
      gap: 10px;
      position: absolute;
      z-index: 2;
      top: clamp(18px, 3vw, 38px);
      left: clamp(20px, 4vw, 56px);
      pointer-events: none;
    }
    .stage-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 13px var(--accent);
    }
    .clock {
      position: absolute;
      z-index: 2;
      left: clamp(20px, 4vw, 56px);
      top: 45%;
      transform: translateY(-50%);
      pointer-events: none;
      user-select: none;
    }
    .clock time {
      display: block;
      color: #f4eee4;
      font: 400 clamp(3.5rem, 8vw, 9rem)/.95 var(--serif);
      font-variant-numeric: lining-nums tabular-nums;
      letter-spacing: -.075em;
      white-space: nowrap;
      text-shadow: 0 3px 30px #080807;
    }
    .date {
      margin: 16px 0 0 3px;
      color: #c5b9a9;
      font-size: .8rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .vitals {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 24px;
      margin: 14px 0 0 3px;
      color: var(--accent);
      font-size: .8rem;
    }
    .breath-wave { width: 46px; height: 16px; opacity: .9; transform-origin: 50% 50%; }
    .breath-wave path { vector-effect: non-scaling-stroke; }
    .life-status {
      margin: 5px 0 0 3px;
      color: var(--muted);
      font-size: .78rem;
      font-variant-numeric: tabular-nums;
    }
    .specimen {
      position: absolute;
      z-index: 2;
      bottom: clamp(18px, 3vw, 34px);
      right: clamp(20px, 4vw, 50px);
      max-width: min(48%, 260px);
      text-align: right;
      pointer-events: none;
    }
    .specimen .caption { color: var(--accent); letter-spacing: .13em; }
    .specimen-name {
      display: block;
      margin-top: 4px;
      font: italic 400 clamp(1.45rem, 2.9vw, 3rem)/1.1 var(--serif);
      text-shadow: 0 3px 20px #080807;
    }
    .field-notes {
      position: absolute;
      z-index: 2;
      bottom: clamp(18px, 3vw, 34px);
      left: clamp(20px, 4vw, 56px);
      max-width: min(44%, 325px);
    }
    .hint { margin: 0; color: var(--muted); font-size: .84rem; line-height: 1.4; }
    .sunlight {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      min-height: 28px;
      margin-top: 7px;
      border: 0;
      background: transparent;
      color: var(--accent);
      text-align: left;
      font-size: .75rem;
    }
    .sunlight:hover { text-decoration: underline; text-underline-offset: 3px; }
    .sunlight:disabled { cursor: wait; opacity: .75; }
    .sunlight svg { width: 16px; height: 16px; flex: none; }

    .catalog {
      display: grid;
      grid-template-columns: minmax(95px, .75fr) 5fr auto;
      gap: 16px;
      align-items: center;
      padding-block: 18px 20px;
    }
    .catalog h2 { margin: 0; font: 400 1.45rem/1 var(--serif); }
    .forms {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 5px;
    }
    .form {
      position: relative;
      min-height: 74px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #12110f;
      color: #c0b6a8;
      white-space: nowrap;
      font-size: .84rem;
      transition: background 160ms, border-color 160ms, color 160ms;
    }
    .form:hover { border-color: #8c7760; color: var(--ink); }
    .form[aria-pressed=true] { color: var(--accent); border-color: #735b43; background: #211b15; }
    .form svg { width: 24px; height: 24px; }
    .mutation {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid #e0be96;
      border-radius: 3px;
      background: #e0be96;
      color: #1a140f;
      white-space: nowrap;
      font-size: .85rem;
      transition: background 160ms, border-color 160ms;
    }
    .mutation:hover { background: #f1d3b1; border-color: #f1d3b1; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .notice {
      position: absolute;
      z-index: 3;
      top: 18px;
      right: 18px;
      max-width: min(260px, 66%);
      margin: 0;
      padding: 9px 12px;
      border: 1px solid #564b3b;
      border-radius: 3px;
      background: #18150fee;
      color: var(--ink);
      font-size: .8rem;
      pointer-events: none;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    body.zen .installation { padding: 0; display: block; }
    body.zen .stage { height: 100vh; height: 100dvh; border: 0; }
    body.zen .masthead, body.zen .catalog, body.zen .field-notes,
    body.zen .specimen, body.zen .stage-label, body.zen .vitals,
    body.zen .life-status { display: none; }

    @media (max-width: 940px) {
      .installation { grid-template-rows: auto minmax(420px, 1fr) auto; }
      .catalog { grid-template-columns: 1fr auto; gap: 10px; }
      .forms { grid-row: 2; grid-column: 1 / -1; }
      .mutation { min-height: 42px; }
    }
    @media (max-width: 800px), (orientation: landscape) and (max-height: 500px) and (max-width: 960px) {
      .installation {
        padding-inline: max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-right));
        grid-template-rows: auto minmax(min-content, 1fr) auto;
      }
      .masthead { padding-block: max(8px, env(safe-area-inset-top)) 8px; gap: 6px; }
      .wordmark { gap: 6px; }
      .wordmark h1 { font-size: 1.25rem; }
      .wordmark svg { width: 23px; height: 23px; }
      .wordmark small { margin-top: 4px; font-size: .62rem; letter-spacing: .04em; }
      .toolbar, .view-tools { gap: 3px; }
      .languages { margin: 0; }
      .languages button, .tool { width: 44px; min-height: 44px; }
      .tool svg { width: 17px; }
      .stage {
        display: grid;
        grid-template:
          "light light" auto
          "clock clock" auto
          "art art" minmax(clamp(170px, 52vw, 270px), 1fr)
          "notes specimen" auto / minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 7px 12px;
        padding: 14px;
        touch-action: manipulation;
      }
      .stage-label, .clock, .field-notes, .specimen {
        position: relative;
        inset: auto;
        min-width: 0;
      }
      .stage-label { grid-area: light; font-size: .7rem; letter-spacing: .12em; }
      .clock { grid-area: clock; transform: none; }
      .clock time { font-size: clamp(2.3rem, 14vw, 5rem); }
      .date { margin: 7px 0 0 2px; font-size: .75rem; letter-spacing: .08em; }
      .vitals { margin-top: 8px; min-height: 18px; font-size: .72rem; }
      .life-status { margin-top: 3px; font-size: .7rem; }
      .art-space { display: block; grid-area: art; }
      .field-notes { grid-area: notes; max-width: none; align-self: end; pointer-events: none; }
      .hint { font-size: .8rem; }
      .sunlight { min-height: 44px; margin-top: 0; font-size: .75rem; pointer-events: auto; }
      .specimen { grid-area: specimen; max-width: none; align-self: end; padding-bottom: 8px; }
      .specimen .caption { font-size: .66rem; letter-spacing: .07em; overflow-wrap: anywhere; }
      .specimen-name { font-size: clamp(1.12rem, 5vw, 1.85rem); overflow-wrap: anywhere; }
      .notice { top: auto; right: 14px; bottom: 14px; }
      .catalog { padding-block: 8px; }
      .catalog h2 { font-size: 1.25rem; }
      .form { min-height: 44px; flex-direction: row; gap: 6px; padding: 5px 3px; white-space: normal; }
      .form svg { width: 19px; height: 19px; }
      .mutation { min-height: 44px; }
      body.zen .stage {
        grid-template: "clock" auto "art" minmax(0, 1fr) / minmax(0, 1fr);
        padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      }
    }
    @media (max-width: 560px) {
      .forms { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 410px) {
      .wordmark svg { display: none; }
      .wordmark h1 { font-size: 1.13rem; }
    }
    @media (max-width: 355px) {
      .masthead { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
      .toolbar { display: contents; }
      .view-tools { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); }
      .view-tools .tool { width: 100%; }
      .form { font-size: .75rem; }
    }
    @media (orientation: landscape) and (max-height: 500px) and (min-width: 560px) and (max-width: 960px) {
      .stage {
        grid-template:
          "light art" auto
          "clock art" minmax(0, 1fr)
          "notes art" auto / minmax(0, 2fr) minmax(0, 3fr);
        min-height: 235px;
        gap: 3px 14px;
        padding: 10px 14px 7px;
      }
      .clock { align-self: center; }
      .clock time { font-size: clamp(2.6rem, 7vw, 4.9rem); }
      .specimen { position: absolute; right: 14px; bottom: 8px; padding: 0; }
      .catalog { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; }
      .catalog h2 { max-width: 6rem; font-size: 1.02rem; }
      .forms { grid-column: auto; grid-row: auto; }
      .form { flex-direction: column; gap: 1px; font-size: .7rem; }
      .form svg { width: 16px; height: 16px; }
      .mutation { padding-inline: 8px; font-size: .75rem; }
      body.zen .stage { grid-template: "clock art" minmax(0, 1fr) / minmax(0, 2fr) minmax(0, 3fr); }
    }
    @media (pointer: coarse) {
      .stage { touch-action: manipulation; }
      .languages button, .tool { min-width: 44px; min-height: 44px; }
      .sunlight, .mutation { min-height: 44px; }
    }
    @media (any-pointer: coarse) {
      .pointer-hint { display: none; }
      .touch-hint { display: inline; }
    }
    @media (any-pointer: coarse) and (min-width: 801px) and (min-height: 501px),
           (any-pointer: coarse) and (min-width: 961px) {
      .art-space { display: block; position: absolute; inset: 10% 5% 12% 37%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="installation">
    <header class="masthead">
      <div class="wordmark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 6C15 3 5 12 7 21c2 8 13 8 16 1 3-6-4-11-9-7-3 2-2 7 2 7 2 0 3-1 3-3"/></svg>
        <div>
          <h1>Living Clock</h1>
          <small><a class="credit" href="https://github.com/berkantkull/living-clock/blob/main/LICENSE" target="_blank" rel="noopener" data-label="copyright" aria-label="Berkant Kul hak bildirimi">© 2026 Berkant Kul</a></small>
        </div>
      </div>
      <div class="toolbar">
        <div class="languages" role="group" aria-label="Dil / Language">
          <button type="button" data-lang="tr" lang="tr" aria-label="Türkçe" aria-pressed="true">TR</button>
          <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
        </div>
        <div class="view-tools">
          <button type="button" class="tool" id="fullscreen" aria-pressed="false" aria-label="Tam ekran" data-label="fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg>
          </button>
          <button type="button" class="tool" id="zen" aria-pressed="false" aria-label="Zen modu" data-label="zen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12c2.5-3.8 5.7-5.7 9.5-5.7s7 1.9 9.5 5.7c-2.5 3.8-5.7 5.7-9.5 5.7s-7-1.9-9.5-5.7Z"/><circle cx="12" cy="12" r="2.2"/></svg>
          </button>
          <button type="button" class="tool" id="save" aria-label="PNG olarak kaydet" data-label="save">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l1.5-2h5L16 8h4v11H4Z"/><circle cx="12" cy="13.3" r="3"/></svg>
          </button>
        </div>
      </div>
    </header>
    <section class="stage" id="stage" aria-label="Canlı saat" data-label="stage" aria-describedby="care-hint care-key" tabindex="0">
      <canvas id="art" aria-hidden="true"></canvas>
      <p class="notice" id="notice" aria-hidden="true" hidden></p>
      <span class="stage-label" id="light-status">Yerel zaman</span>
      <div class="clock">
        <time id="time"></time>
        <p class="date" id="date"></p>
        <div class="vitals">
          <svg class="breath-wave" id="breath-wave" viewBox="0 0 48 16" aria-hidden="true"><path d="M1 9c7 0 8-7 16-7 7 0 10 11 16 11 5 0 8-4 14-4"/></svg>
          <span id="breath-label"></span>
        </div>
        <p class="life-status" id="life-status"></p>
      </div>
      <div class="art-space" id="art-space" aria-hidden="true"></div>
      <div class="field-notes">
        <p class="hint" id="care-hint">
          <span class="pointer-hint" data-text="hint">Yakınında bekle ya da yavaşça gezin. Sık dokunmak uzantılarına zarar verir.</span>
          <span class="touch-hint" data-text="touchHint">Parmağını formun üzerinde gezdir ya da beklet. Kaydırmak için sahnenin dışından başla.</span>
        </p>
        <span class="sr-only" id="care-key" data-text="careKey">Sahne odaktayken boşluk tuşu formu besler.</span>
        <button type="button" class="sunlight" id="sunlight" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg>
          <span id="sunlight-label">Güneş ışığını eşle</span>
        </button>
      </div>
      <div class="specimen">
        <span class="caption" id="signature"></span>
        <span class="specimen-name" id="specimen-name"></span>
      </div>
    </section>
    <section class="catalog" aria-labelledby="catalog-title">
      <h2 id="catalog-title" data-text="forms">Yaşam biçimleri</h2>
      <div class="forms" role="group" aria-labelledby="catalog-title">
        <button type="button" class="form" data-form="veil" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11c2-9 16-9 18 0-5 4-13 4-18 0Zm4 2c-2 3 3 5 0 8m5-7c-2 3 3 4 0 7m5-8c-2 3 2 4 0 7"/></svg>
          <span data-text="veil">Peçe</span>
        </button>
        <button type="button" class="form" data-form="root" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c-.2-5 2-8 1-12-.5-2-2-4-1-8m1 11c-3-2-6-2-8-7m8 4c1-3 5-3 6-7M9 11c-2 0-4 1-6-1m10 7c3-3 5-1 8-5"/></svg>
          <span data-text="root">Kök</span>
        </button>
        <button type="button" class="form" data-form="spore" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 10 7 7m7 3 3-4m-5 9v4m4-6 4 1"/><circle cx="12.8" cy="12.2" r="3.3"/><circle cx="5.4" cy="5.4" r="2.2"/><circle cx="18.3" cy="4.7" r="1.8"/><circle cx="12" cy="20" r="1.7"/><circle cx="21" cy="14" r="1.3"/></svg>
          <span data-text="spore">Spor</span>
        </button>
        <button type="button" class="form" data-form="fold" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19C5 2 21 2 20 8S4 9 6 16c1 4 9 4 16-2M4 21c4-6 12-7 18-7"/></svg>
          <span data-text="fold">Kıvrım</span>
        </button>
        <button type="button" class="form" data-form="colony" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 4.4 2.6v5L12 13l-4.4-2.4v-5L12 3Zm-4.4 7.6 4.4 2.6v5l-4.4 2.4-4.4-2.4v-5l4.4-2.6Zm8.8 0 4.4 2.6v5l-4.4 2.4-4.4-2.4v-5l4.4-2.6Z"/></svg>
          <span data-text="colony">Koloni</span>
        </button>
        <button type="button" class="form" data-form="filament" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8c5 0 8 9 18 7M3 12c6-6 12 6 18 0M3 16c6-1 11-11 18-8M4 20c5-5 7-13 16-16"/></svg>
          <span data-text="filament">Lif</span>
        </button>
      </div>
      <button type="button" class="mutation" id="mutation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c0 6 3 9 9 9-6 0-9 3-9 9 0-6-3-9-9-9 6 0 9-3 9-9Z"/></svg>
        <span data-text="mutation">Yeni yaşam</span>
      </button>
    </section>
    <p class="sr-only" id="announcement" role="status"></p>

  <script>

      function coordinates(event) {
        const bounds = canvas.getBoundingClientRect();
        return [
          clamp((event.clientX - bounds.left) / width, 0, 1),
          clamp((event.clientY - bounds.top) / height, 0, 1)

      }

      function setPointer(event) {
        const [x, y] = coordinates(event);
        const px = x * width, py = y * height;
        if (event.pointerType === "touch") {
          pointer.targetX = clamp((px - centerX) / (unit * 1.26), -1, 1);
          pointer.targetY = clamp((py - centerY) / (unit * 1.26), -1, 1);

          finger.y = y;
        } else {
          pointer.targetX = (x - .5) * 2;
          pointer.targetY = (y - .5) * 2;
        }
        const now = performance.now();
        const dt = (now - pointer.lastMove) / 1000;
        pointer.speed = Number.isFinite(dt) && dt > .008 && dt < .4
          ? Math.hypot(px - pointer.lastX, py - pointer.lastY) / (unit * dt) : 0;
        pointer.lastX = px;
        pointer.lastY = py;
        pointer.lastMove = now;
        const distance = Math.hypot((px - centerX) / 1.13, py - centerY);
        if (distance <= unit * 1.32) {
          if (!Number.isFinite(pointer.nearbySince)) pointer.nearbySince = now;
        } else {

        }

      function releasePointer() {
        pointer.targetX = pointer.targetY = 0;
        pointer.nearbySince = pointer.lastMove = -Infinity;
      }

      function tapLife(event) {
        if (event.button > 0 || event.target.closest("button")) return;

        const [x, y] = coordinates(event);

        if (Math.hypot((x * width - centerX) / 1.13, y * height - centerY) > unit * 1.40) return;
        impactAt = timestamp;
        const px = x * width, py = y * height;
        while (taps.length && timestamp - taps[0].at > 1700) taps.shift();
        let localHits = 1;
        for (const tap of taps) {
          if (Math.hypot(tap.x - px, tap.y - py) < unit * .52) localHits++;
        }
        taps.push({ x: px, y: py, at: timestamp });
        const v = current.vitals;
        v.stress = Math.min(1, v.stress + (localHits > 1 ? .13 : .025));
        if (contact && localHits === 1) v.energy = Math.min(1, v.energy + .022);
        else v.energy = Math.max(.12, v.energy - (localHits > 1 ? .022 : .004));
        if (localHits >= 5) {
          const limb = nearbyLimb(px, py);

      function pointerStart(event) {
        if (event.pointerType !== "touch") {
          if (!touchGesture) tapLife(event);
          return;
        }
        if (!event.isPrimary) {
          if (touchGesture) touchGesture.dragged = true;
          return;
        }
        const tracking = artSpace.contains(event.target);
        if (touchGesture || event.target.closest("button") || (!tracking && !zen)) return;
        touchGesture = {
          id: event.pointerId, x: event.clientX, y: event.clientY,
          started: performance.now(), dragged: false, tracking
        };
        if (tracking) {
          artSpace.setPointerCapture(event.pointerId);
          setPointer(event);
        }
      }

      function pointerMove(event) {
        if (event.pointerType === "touch") {
          if (!touchGesture || touchGesture.id !== event.pointerId) return;
          touchGesture.dragged ||= Math.hypot(event.clientX - touchGesture.x, event.clientY - touchGesture.y) > 12;
          if (!touchGesture.tracking) return;
        } else if (touchGesture) {
          return;
        }
        setPointer(event);
      }

      function pointerEnd(event) {
        if (event.pointerType === "mouse") return;
        if (event.pointerType === "touch") {
          if (touchGesture?.id !== event.pointerId) return;

          const closeToStart = Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) <= 12;

      function pointerCancel(event) {
        if (event.pointerType === "touch") {
          if (touchGesture?.id !== event.pointerId) return;

      function toggleZen() {
        zen = !zen;

        const picture = document.createElement("canvas");

        output.font = fontSize + 'px Georgia, serif';
        output.fillText(timeNode.textContent, clockBox.left - stageBox.left, clockBox.top - stageBox.top + clockBox.height / 2, width - 24);

          link.href = url;
          link.download = filename;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2500);

      const storedFamily = restore("family", "veil");

      const storedSeed = restore("seed", "");
      const seed = /^\d{1,10}$/.test(storedSeed) ? Number(storedSeed) >>> 0 : 0x67E2C3A1;
